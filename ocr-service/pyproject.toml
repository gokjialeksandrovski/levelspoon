[project]
name = "levelspoon-ocr"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "python-multipart>=0.0.17"]

[project.optional-dependencies]
ocr = ["paddleocr==3.7.0", "paddlepaddle==3.2.0", "pillow>=11.0", "numpy>=2.0"]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.16"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real: hits the running OCR container with real photographs (tier 4, local only)"]
