[project]
name = "levelspoon-ocr"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.162", "uvicorn[standard]>=0.54", "python-multipart>=0.0.33"]

[project.optional-dependencies]
ocr = ["paddleocr==3.7.0", "paddlepaddle==3.2.2", "pillow>=13.0", "numpy>=2.0"]
dev = ["pytest>=9.2", "httpx2>=2.16", "ruff>=0.17"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real: hits the running OCR container with real photographs (tier 4, local only)"]
